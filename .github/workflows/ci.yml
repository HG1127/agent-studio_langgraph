name: Agent Studio Quality Gates
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Architectural dependency rules
        run: python ../../scripts/check_architecture.py
      - name: Backend contract and policy tests
        run: python -m unittest discover -s tests -v
      - name: API-to-Worker integration smoke (stub model only)
        run: python ../../scripts/smoke_process.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
  proxy-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.lock.txt
      - name: Install Next.js dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Same-origin HttpOnly Cookie and Workspace smoke
        run: python scripts/smoke_web_proxy.py
